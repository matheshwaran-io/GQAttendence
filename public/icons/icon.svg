<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#311042" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <!-- Outer glowing rings -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#accent)" stroke-width="8" stroke-dasharray="16 16" opacity="0.4" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="url(#accent)" stroke-width="4" opacity="0.6" />
  <!-- Inner graphic: stylized Checkmark + 11 -->
  <g transform="translate(186, 176)">
    <!-- Stylized checkmark -->
    <path d="M20 70 L50 100 L120 20" fill="none" stroke="#38bdf8" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Number 11 inside -->
    <text x="65" y="105" font-family="'Outfit', 'Inter', sans-serif" font-size="96" font-weight="900" fill="#ffffff" opacity="0.95">11</text>
  </g>
</svg>
